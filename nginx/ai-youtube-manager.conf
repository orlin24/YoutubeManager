# AI YouTube Manager - nginx reverse proxy
# Copy to /etc/nginx/sites-available/, symlink into sites-enabled, adjust
# server_name to your domain, then: nginx -t && systemctl reload nginx
# For SSL, run: certbot --nginx -d youtube-manager.example.com

server {
    listen 80;
    server_name youtube-manager.example.com;

    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Security headers (CSP allows self + inline styles used by Tailwind)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'" always;
}
